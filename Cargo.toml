[package]
name = "amenui-website"
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/amenui-dev/website"
publish = false
# The files in examples/ are the showcase pieces (`website::showcase`), compiled into the library.
autoexamples = false

[lib]
name = "website"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The framework, from its main branch. To work on both at once, put a checkout of amenui next to this
# one and uncomment the [patch] below.
amenui = { git = "https://github.com/amenui-dev/amenui", branch = "main" }
wgpu = { version = "30", default-features = false }
taffy = "0.15"
pollster = "0.4"
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
png = "0.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The site's own exports beside the ones `amenui::web_app!` makes (the readout's choice).
wasm-bindgen = "0.2"

# [patch."https://github.com/amenui-dev/amenui"]
# amenui = { path = "../amenui" }

# The web build: small code that still runs fast. With one codegen unit and LTO, opt-level "s" sends
# about 11 % more than "z" (3.0 MB against 2.7 MB compressed) and lays a frame out about a quarter
# faster (the home page's 12 ms against 9 ms in headless Chrome); "3" is a little faster again and
# sends 4.2 MB. Panics already abort on wasm32-unknown-unknown; symbols are left for wasm-bindgen,
# which reads the target-features section, and removed by it (`--remove-name-section`).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# For iterating on the tools: optimised for speed, without the slow link-time step.
[profile.quick]
inherits = "release"
opt-level = "s"
lto = false
codegen-units = 16
incremental = true
