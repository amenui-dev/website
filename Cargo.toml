[package]
name = "amenui-website"
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/amenui-dev/website"
publish = false
# The files in examples/ are the showcase pieces (`website::showcase`), compiled into the library.
autoexamples = false

[lib]
name = "website"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The framework, from its main branch. To work on both at once, put a checkout of amenui next to this
# one and uncomment the [patch] below.
amenui = { git = "https://github.com/amenui-dev/amenui", branch = "main" }
wgpu = { version = "30", default-features = false }
taffy = "0.15"
pollster = "0.4"
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
png = "0.17"
winit = "0.30"
# The system clipboard for the native window (X11 through x11rb, no C libraries).
arboard = { version = "3", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Document", "console", "Performance"] }
console_error_panic_hook = "0.1"

# [patch."https://github.com/amenui-dev/amenui"]
# amenui = { path = "../amenui" }

[profile.release]
opt-level = "s"
lto = true

# For iterating on the tools: optimised, but without the slow link-time step.
[profile.quick]
inherits = "release"
lto = false
incremental = true
