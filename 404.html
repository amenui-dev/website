.pn a:hover { border-color: var(--ink); }
.pn small { font-size: inherit; color: var(--dim); }
.pn .next { text-align: right; align-items: flex-end; grid-column: 2; }
.pn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }

/* Table of contents: second-level headings; the one in view in ink, its mark in the accent. */
.toc .label { margin: 0 0 8px; color: var(--dim); text-transform: uppercase; }
.toc ol { list-style: none; margin: 0 0 24px; padding: 0; }
.toc li a { position: relative; display: block; padding: 7px 0 7px 16px; color: var(--text); text-transform: uppercase; }
.toc li a:hover { color: var(--ink); }
.toc li a.on { color: var(--ink); } .toc .here { color: var(--accent); }
.toc li a.on::before { content: "▸"; position: absolute; left: 0; }
.toc .links a { display: block; padding: 7px 0; color: var(--text); text-transform: uppercase; }
.toc .links a:hover { color: var(--ink); }
.toc-inline { display: none; margin: 0 0 32px; font: 11px/14px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.toc-inline summary { cursor: pointer; color: var(--dim); list-style: none; height: 28px; display: flex; align-items: center; }
.toc-inline summary::-webkit-details-marker { display: none; }
.toc-inline ol { list-style: none; margin: 0; padding: 0 0 0 16px; border-left: 1px solid var(--hairline); }
.toc-inline a { display: block; padding: 7px 0; color: var(--text); }

/* The live stage: the route's stage alone, 280 px tall (200 on a phone), full width, a hairline frame on
   the raised colour and a 28 px caption strip. The still is drawn at the desktop box's size and shown
   at its own size, centred, so a narrower box crops it as the live canvas does. */
.stage { margin: 32px 0; view-transition-name: stage; }
.stage .box { position: relative; height: 280px; background: var(--raised); border: 1px solid var(--hairline); overflow: hidden; }
@media (max-width: 719px) { .stage .box { height: 200px; } }
html:not(.js) .stage .run { cursor: default; }
.stage .run { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; margin: 0; border: 0; background: none; cursor: pointer; display: block; }
.stage .box .live { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
/* A still at its own size (docs.STILLS), centred: a box of another width crops it. */
.stage .box img { position: absolute; left: 50%; top: 50%; width: 718px; height: 278px; max-width: none; transform: translate(-50%, -50%); display: block; }
@media (max-width: 719px) { .stage .box img { width: min(358px, 100%); height: auto; } }
/* The still of the scheme the page is in. */
.stage img.s-light { display: none; }
:root[data-theme="light"] .stage img.s-light { display: block; } :root[data-theme="light"] .stage img.s-dark { display: none; }
@media (prefers-color-scheme: light) { :root:not([data-theme]) .stage img.s-light { display: block; } :root:not([data-theme]) .stage img.s-dark { display: none; } }
.stage .live canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
.stage .live .a11y { position: absolute; inset: 0; opacity: 0; pointer-events: none; overflow: hidden; }
.stage .live .a11y div { position: fixed; overflow: hidden; white-space: nowrap; color: transparent; }
.stage .live .ta { position: absolute; left: 0; top: 0; width: 2px; height: 20px; padding: 0; border: 0; margin: 0; resize: none; overflow: hidden; opacity: 0; color: transparent; background: transparent; caret-color: transparent; outline: none; white-space: pre; pointer-events: none; }
.stage figcaption { display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 28px; padding: 4px 0; font: 11px/14px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.stage figcaption a, .stage figcaption button { color: var(--text); font: inherit; letter-spacing: inherit; text-transform: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none; }
.stage figcaption a:hover, .stage figcaption button:hover { color: var(--ink); }
.stage.on .state { color: var(--accent); }
.stage .acts { display: flex; gap: 16px; flex: none; }

/* The docs index: groups behind section headers (D.4). */
/* Section header (D.4): a hairline with an index and a name set into it, 11 px; 48 px above, 24 below. */
.prose h2.sec { font: 11px/14px var(--mono); letter-spacing: .06em; text-transform: uppercase; gap: 12px; margin: 48px 0 24px; }
.prose h2.sec::before { flex-basis: 16px; }
.prose h2.sec small { font: inherit; color: var(--dim); }
.prose h2.sec small::after { content: ""; display: inline-block; width: 16px; height: 1px; background: var(--hairline); vertical-align: middle; margin-left: 12px; }
.idx { list-style: none; padding: 0; margin: 0 0 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); column-gap: 24px; }
.idx li { min-width: 0; overflow-wrap: anywhere; margin: 0; padding: 12px 0; border-bottom: 1px solid var(--hairline); }
.idx a { display: flex; gap: 12px; color: var(--ink); text-decoration: none; font: 11px/14px var(--mono); letter-spacing: .06em; text-transform: uppercase; -webkit-font-smoothing: none; }
.idx a:hover { color: var(--ink); }
.idx small { font-size: inherit; color: var(--dim); flex: none; width: 40px; }
.idx p { margin: 6px 0 0 52px; font-size: 15px; line-height: 1.5; color: var(--text); }
.idx.compact li { padding: 8px 0; }
.idx .subhead { grid-column: 1 / -1; border: 0; padding: 16px 0 4px; font: 11px/14px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }

/* The 404 page: "Not found" at 44 px, one line, three doors. */
.nf { max-width: 1320px; margin: 0 auto; padding: 168px var(--m) 120px; }
.nf h1 { font: 44px/44px var(--mono); color: var(--ink); margin: 0 0 24px; -webkit-font-smoothing: none; }
.nf p { margin: 0 0 32px; color: var(--text); }
html[lang="zh-Hans"] .nf p { font: 16px/1.75 var(--cjk); }
.nf .doors { display: flex; flex-wrap: wrap; gap: 12px; }
.nf .btn { display: inline-flex; align-items: center; height: 40px; padding: 0 16px; font: 11px/11px var(--mono); letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--hairline); color: var(--ink); -webkit-font-smoothing: none; }
.nf .btn:hover { border-color: var(--ink); }
@media (max-width: 719px) { .nf { padding-top: 120px; } .nf .doors { flex-direction: column; } .nf .btn { height: 48px; justify-content: center; } }

/* The footer: GitHub and the version, which leave the bar below 1,080 px. */
.foot { max-width: 1320px; margin: 0 auto; padding: 24px var(--m) 32px; display: flex; gap: 24px; color: var(--dim); text-transform: uppercase; border-top: 1px solid var(--hairline); }
.foot a { color: var(--text); } .foot a:hover { color: var(--ink); }

/* 1,080 to 1,279 px: the contents fold into a line under the title. */
@media (max-width: 1279px) {
  .docs { grid-template-columns: 232px minmax(0, 720px); }
  .toc { display: none; }
  .toc-inline { display: block; }
}
/* Below 1,080 px: the sidebar is a sheet opened from the path line. */
@media (max-width: 1079px) {
  .docs { grid-template-columns: minmax(0, 720px); }
  .side { display: none; position: fixed; z-index: 9; inset: 48px 0 0 0; max-height: none; background: var(--ground); padding: 0 var(--m); }
  .side:target, .side.open { display: block; }
  .side-close { display: flex; position: sticky; top: 0; justify-content: flex-end; align-items: center; height: 44px; font: 22px/22px var(--mono); color: var(--text); margin-bottom: -12px; }

@media (max-width: 719px) {
